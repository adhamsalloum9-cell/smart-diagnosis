  input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-family: inherit; margin-bottom: 15px; }

  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; }
  .item-row:last-child { border-bottom: none; }
  .item-text { flex: 1; font-size: 14px; text-align: right; }
  
  .rating-group { display: flex; gap: 10px; flex-shrink: 0; }
  .rating-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; margin-bottom: 0; font-size: 13px; }
  input[type="radio"] { width: 18px; height: 18px; accent-color: #0f766e; margin: 0; }

  .actions { margin-top: 20px; text-align: center; }
  button { padding: 14px 30px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 16px; background: #0f766e; color: white; transition: 0.2s; width: 100%; }
  button:hover { background: #115e59; }
  
  .result-area { display: none; margin-top: 30px; padding: 20px; border-radius: 12px; border: 2px solid #0f766e; background: #f0fdfa; }
  .result-area h3 { color: #0f766e; font-size: 22px; margin-bottom: 15px; border-bottom: 2px solid #0f766e; padding-bottom: 8px; }
  .section-title { font-size: 18px; font-weight: bold; color: #0f766e; margin: 20px 0 10px; }
  .justification { font-size: 15px; color: #334155; margin-bottom: 15px; background: white; padding: 10px; border-radius: 8px; border-right: 4px solid #0f766e; }
  .recommendation { background: #fff; padding: 15px; border-radius: 8px; border-right: 4px solid #0f766e; font-size: 15px; margin-bottom: 15px; }
  .print-btn { background: #0284c7; margin-top: 20px; }
  
  @media print {
    body { background: white; padding: 0; font-family: Arial, sans-serif; }

</head>

      { en: "Uses a sentence length of approximately six words", ar: "يستخدم جملاً بطول ست كلمات تقريباً." },
      { en: "Understands most concepts of time", ar: "يفهم معظم مفاهيم الوقت." },
      { en: "Counts to 100 by rote", ar: "يعد حتى 100 عن ظهر قلب." },
      { en: "Uses most morphologic markers appropriately", ar: "يستخدم معظم العلامات الصرفية بشكل مناسب." },
      { en: "Uses passive voice appropriately", ar: "يستخدم المبني للمجهول بشكل مناسب." }
    ]
  }
];

// توليد الاستمارة
function generateForm() {
  const container = document.getElementById('itemsContainer');
  inventoryData.forEach((group, groupIndex) => {
    const groupDiv = document.createElement('div');
    groupDiv.innerHTML = `<div class="age-group-title">${group.ageGroup}</div>`;
    
    group.items.forEach((item, itemIndex) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-text" dir="rtl">${item.ar}</div>
        <div class="rating-group">
          <label><input type="radio" name="item_${groupIndex}_${itemIndex}" value="2"> يوجد</label>
          <label><input type="radio" name="item_${groupIndex}_${itemIndex}" value="1"> أحياناً</label>
          <label><input type="radio" name="item_${groupIndex}_${itemIndex}" value="0"> لا يوجد</label>
        </div>
      `;
      groupDiv.appendChild(row);
    });
    container.appendChild(groupDiv);
  });
}

function analyzeInventory() {
  let totalPossible = 0;
  let totalScore = 0;
  let ageGroupScores = [];
  let missingAnswers = false;

  inventoryData.forEach((group, groupIndex) => {
    let groupPossible = group.items.length * 2;
    let groupScore = 0;
    
    group.items.forEach((item, itemIndex) => {
      const selected = document.querySelector(`input[name="item_${groupIndex}_${itemIndex}"]:checked`);
      if (!selected) {
        missingAnswers = true;
      } else {
        groupScore += parseInt(selected.value);
      }
    });
    
    totalPossible += groupPossible;
    totalScore += groupScore;
    ageGroupScores.push({
      group: group.ageGroup,
      score: groupScore,
      possible: groupPossible,
      percentage: (groupScore / groupPossible) * 100
    });
  });

  if (missingAnswers) {
    alert('الرجاء الإجابة على جميع البنود للحصول على تحليل دقيق.');
    return;
  }

  const overallPercentage = (totalScore / totalPossible) * 100;
  
  let diagnosis = "";
  let recommendation = "";
  let severityColor = "";

  if (overallPercentage >= 85) {
    diagnosis = "نمو لغوي ضمن الحدود الطبيعية";
    recommendation = "المستفيد يمتلك معظم المهارات المتوقعة لعمره. يوصى بالمراقبة الدورية ودعم النمو اللغوي من خلال الأنشطة اليومية.";
    severityColor = "#10b981";
  } else if (overallPercentage >= 70) {
    diagnosis = "تأخر لغوي بسيط (Mild Language Delay)";
    recommendation = "يوصى بتقييم لغوي رسمي (Formal Assessment) مثل CELF-Preschool، وتقديم أنشطة لغوية منزلية مكثفة. المتابعة بعد 3 أشهر.";
    severityColor = "#3b82f6";
  } else if (overallPercentage >= 50) {
    diagnosis = "تأخر لغوي متوسط (Moderate Language Delay)";
    recommendation = "يوصى ببدء تدخل علاجي مباشر (Speech Therapy) مع التركيز على المهارات المفقودة. استخدام ABLLS-R لتقييم أعمق.";
    severityColor = "#f59e0b";
  } else {
    diagnosis = "تأخر لغوي شديد أو اضطراب لغوي (Severe Language Delay/Disorder)";
    recommendation = "يوصى بتحويل فوري لتقييم شامل متعدد التخصصات (سمع، نمو، نفسي)، وبدء خطة تدخل مكثفة (IEP).";
    severityColor = "#dc2626";
  }

  let groupBreakdown = ageGroupScores.map(g => `<li><strong>${g.group}:</strong> ${g.percentage.toFixed(1)}%</li>`).join('');

  const resultHTML = `
    <h3>نتيجة التحليل</h3>
    <div style="font-size:20px; font-weight:bold; color:${severityColor}; margin-bottom:20px;">${diagnosis}</div>
    <p style="font-size:15px; margin-bottom:15px;">النسبة الإجمالية لتحقيق المهارات المتوقعة: <strong>${overallPercentage.toFixed(1)}%</strong></p>
    
    <div class="section-title">التفصيل حسب الفئة العمرية:</div>
    <ul style="list-style:none; padding:0; margin-bottom:20px; line-height:2;">
      ${groupBreakdown}
    </ul>

    <div class="section-title">التوصيات:</div>
    <div class="recommendation">${recommendation}</div>
  `;

  document.getElementById('resultContent').innerHTML = resultHTML;
  const resultArea = document.getElementById('resultArea');
  resultArea.style.display = 'block';
  resultArea.scrollIntoView({ behavior: 'smooth' });
}

// تشغيل التوليد عند تحميل الصفحة
window.onload = generateForm;
</script>
